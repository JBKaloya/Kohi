# Static host for the Kohi review site.
# Point a server at this directory. Copy config.js next to index.html
# (it is gitignored; it holds the publishable key).

server {
    listen 80;
    server_name _;

    root /var/www/kohi-review;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
